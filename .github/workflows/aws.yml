# This workflow will install Composer dependencies and deploy your PHP code 
# directly to your AWS EC2 Apache web root directory when there is a push to the "main" branch.

name: Deploy PHP App to AWS EC2

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: eu-north-1                      
  EC2_USER: ec2-user                           # ✨ Restored to ubuntu (root is blocked by AWS by default)
  TARGET_DIR: /var/www/html/                 # Standard Apache web root

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4.2.2          

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3' 
    - name: Install Composer Dependencies
      run: |
        if [ -f "composer.json" ]; then
          composer install --no-dev --optimize-autoloader --no-interaction
        fi

    - name: Deploy to EC2 via SSH rsync
      uses: easingthemes/ssh-deploy@main     
      with:
        SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        REMOTE_HOST: ${{ secrets.EC2_PUBLIC_IP }}
        REMOTE_USER: ${{ env.EC2_USER }}
        TARGET: ${{ env.TARGET_DIR }}
        ARGS: "-rlgoDzv --no-perms --no-owner --no-group --no-t --delete --exclude='.git/' --exclude='.github/'"
        SSH_CMD_ARGS: "-o StrictHostKeyChecking=no"
        SCRIPT_AFTER: |
          # Keep ownership tied to ubuntu and the apache group so future deployments don't lock out
          #sudo chown -R ubuntu:www-data ${{ env.TARGET_DIR }}
          sudo chown -R ubuntu:www-data ${{ env.TARGET_DIR }} #new line added on 2024-06-19 to fix permission issues with uploaded files
          #sudo chmod -R 775 ${{ env.TARGET_DIR }}          
          sudo chmod -R 775 ${{ env.TARGET_DIR }} #new line added on 2024-06-19 to fix permission issues with uploaded files

          # Reload Apache configuration safely
          sudo systemctl restart apache2

